

services:
    
    backend: 
       build: 
          context: ./back
       container_name: skillconnect-backend
       restart: always
       ports:
         - "8000:8000"
       env_file: 
          - './back/.env'
       depends_on:
         - redis
       
    frontend:
      build: 
         context: ./front/frontend
      container_name: skillconnect-frontend
      restart: always
      ports:
       - "5173:5173"
      env_file:
       - "./front/frontend/.env"
      depends_on:
         - backend 

    redis:
        image: redis:7-alpine
        container_name: skillconnect-redis
        restart: always
        ports:
         - "6379:6379"